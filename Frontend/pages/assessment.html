<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Skill assessment — Updraft</title>
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
  <aside class="sidebar">
    <a class="brand" href="../index.html"><span class="brandmark">u.</span><span>updraft<span class="brand-dot">.</span></span></a>
    <div class="side-label">WORKSPACE</div>
    <nav>
      <a class="nav-item" href="../index.html">Overview</a>
      <a class="nav-item active" href="assessment.html">Skill assessment</a>
      <a class="nav-item" href="plan.html">Prep plan</a>
      <a class="nav-item" href="practice.html">Practice arena</a>
      <a class="nav-item" href="mock-interview.html">Mock interview</a>
      <a class="nav-item" href="reports.html">Progress reports</a>
    </nav>
  </aside>

  <main class="main">
    <header class="topbar"><div class="breadcrumbs"><a href="../index.html">Workspace</a> <span>/</span> Skill assessment</div><span id="today"></span></header>
    <div class="content">
      <div class="page-head">
        <div class="eyebrow">PERSONALIZE YOUR PREPARATION</div>
        <h1>Set your interview goals.</h1>
        <p>Choose a role and select the areas you want to focus on.</p>
      </div>

      <form class="panel" data-local-form>
        <label class="field-label" for="role">What role are you preparing for?</label>
        <input id="role" name="role" class="text-input" type="text" placeholder="Enter a role">

        <label class="field-label" for="experience">What experience level are you targeting?</label>
        <select id="experience" name="experience" class="text-input">
          <option value="">Choose an experience level</option>
          <option>Entry level</option><option>Mid-level</option>
          <option>Senior</option><option>Staff or leadership</option>
        </select>

        <fieldset class="field-group">
          <legend class="field-label">Which areas would you like to work on?</legend>
          <div class="check-grid">
            <label><input type="checkbox" name="focus" value="Algorithms"> Algorithms</label>
            <label><input type="checkbox" name="focus" value="System design"> System design</label>
            <label><input type="checkbox" name="focus" value="Behavioral"> Behavioral interviews</label>
            <label><input type="checkbox" name="focus" value="Communication"> Communication</label>
            <label><input type="checkbox" name="focus" value="Role knowledge"> Role knowledge</label>
          </div>
        </fieldset>

        <button class="action" type="submit">Save preferences</button>
        <p class="form-message" aria-live="polite"></p>
      </form>
    </div>
  </main>
  <script src="../js/app.js"></script>
</body>
</html>

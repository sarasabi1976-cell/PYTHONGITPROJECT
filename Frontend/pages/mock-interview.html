<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Mock interview — Updraft</title>
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
  <aside class="sidebar">
    <a class="brand" href="../index.html"><span class="brandmark">u.</span><span>updraft<span class="brand-dot">.</span></span></a>
    <div class="side-label">WORKSPACE</div>
    <nav>
      <a class="nav-item" href="../index.html">Overview</a>
      <a class="nav-item" href="assessment.html">Skill assessment</a>
      <a class="nav-item" href="plan.html">Prep plan</a>
      <a class="nav-item" href="practice.html">Practice arena</a>
      <a class="nav-item active" href="mock-interview.html">Mock interview</a>
      <a class="nav-item" href="reports.html">Progress reports</a>
    </nav>
  </aside>

  <main class="main">
    <header class="topbar"><div class="breadcrumbs"><a href="../index.html">Workspace</a> <span>/</span> Mock interview</div><span id="today"></span></header>
    <div class="content">
      <div class="page-head">
        <div class="eyebrow">INTERVIEW PRACTICE</div>
        <h1>Set up a mock interview.</h1>
        <p>Choose the format and preferences for your practice session.</p>
      </div>

      <form class="panel" data-local-form>
        <label class="field-label" for="format">Interview format</label>
        <select id="format" name="format" class="text-input">
          <option value="">Choose a format</option>
          <option>Coding</option><option>System design</option>
          <option>Behavioral</option><option>Mixed interview</option>
        </select>

        <label class="field-label" for="difficulty">Practice intensity</label>
        <select id="difficulty" name="difficulty" class="text-input">
          <option value="">Choose an intensity</option>
          <option>Warm-up</option><option>Standard practice</option><option>High pressure</option>
        </select>

        <label class="field-label" for="style">Interviewer style</label>
        <select id="style" name="style" class="text-input">
          <option value="">Choose a style</option>
          <option>Supportive</option><option>Observational</option><option>Challenging</option>
        </select>

        <button class="action" type="submit">Save session preferences</button>
        <p class="form-message" aria-live="polite"></p>
      </form>
    </div>
  </main>
  <script src="../js/app.js"></script>
</body>
</html>
